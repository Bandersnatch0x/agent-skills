<!doctype html>
<html lang="zh" data-view="dynamic-census">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>票况普查 · 地图 #19</title>
<!-- 原型实现:incubator/workflow-view/gen-board.mjs —— 动态票况视图生成器(设计票 #29、实现票 08)。单一自包含 HTML + 内联 SVG,无脚本;快照在生成时固化。
     皮肤面代币与静态刀共用同一份 tokens.mjs;同输入必须产出逐字节相同。 -->
<style>
  :root{--paper:#fdfcfa;--paper2:#f5f2ee;--ink:#26221f;--ink-strong:#141210;--muted:#6f6862;--rule:#ded8d1;--accent:#c2563f;--accent-tint:#f7e7e2}
  @media (prefers-color-scheme:dark){:root{--paper:#16151a;--paper2:#1e1d23;--ink:#f2eee9;--ink-strong:#fbf8f4;--muted:#a9a29b;--rule:#3a3840;--accent:#e2795f;--accent-tint:#3a2620}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 ui-sans-serif,system-ui,"Segoe UI",sans-serif}
  .wrap{max-width:1408px;margin:0 auto;padding:24px}
  svg{display:block;background:var(--paper)}
  .hdr{fill:var(--ink-strong);font-size:15px;font-weight:600}
  .hdr-note{fill:var(--muted);font-size:12px}
  .board{position:relative;font:13px/1.5 ui-sans-serif,system-ui,"Segoe UI",sans-serif}
  .col{position:absolute}
  .chead{display:flex;justify-content:space-between;align-items:center;height:32px;padding:0 12px;
         color:var(--ink-strong);font-weight:600;border-bottom:1px solid var(--rule)}
  .chip{border:1px solid var(--rule);border-radius:8px;padding:0 8px;color:var(--muted);font-size:12px}
  .chip.over{border-color:var(--accent);color:var(--accent);background:var(--accent-tint)}
  .slot{position:absolute;left:0;width:320px;height:64px}
  .card{height:64px;padding:8px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--paper2);overflow:hidden}
  .card .t{color:var(--ink-strong);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .m{color:var(--muted);font-size:12px}
  .card.blocked{border-style:dashed;border-color:var(--accent);background:var(--accent-tint);box-shadow:inset 4px 0 0 var(--accent)}
  .card.done{border-color:var(--rule)}
  .card.done .t{color:var(--muted);font-weight:500}
  .card.done .m{color:var(--muted)}
  .card.waiting-external{border-style:dashed;border-color:var(--muted)}
  .card.more{border-style:dashed;color:var(--muted);display:flex;align-items:center}
  .card.empty{border-style:dashed;color:var(--muted);display:flex;align-items:center}
</style>
</head>
<body>
<div class="wrap">
<svg role="img" viewBox="0 0 1072 556" width="100%" aria-labelledby="bt bd">
    <title id="bt">票况普查:地图 #19 的 12 张子票</title>
    <desc id="bd">按阶段分列的状态普查。待认领 1;进行中 0;完成 11。看板内不含任何连接件。</desc>
    <rect x="0" y="0" width="1072" height="88" fill="var(--paper2)"/>
    <text x="24" y="40" class="hdr">票况普查 · 地图 #19 · 12 张子票</text>
    <text x="24" y="64" class="hdr-note">快照时点 2026-09-24T17:52:58.954Z;取数于生成时固化、不做运行时刷新;看板内禁止连接件;等待仓外解锁 0 张</text>
    <foreignObject x="24" y="88" width="1024" height="100%">
      <div xmlns="http://www.w3.org/1999/xhtml" class="board" style="width:1024px;height:600px">
    <div class="col" style="left:24px;width:320px;top:88px">
      <div class="chead "><span>待认领</span><span class="chip ">1/4</span></div>
      <div class="slot" style="top:148px"><div class="card default">
          <div class="t">#31 Spec: agent-scaffold v2 工具套件与运行环境落地</div>
          <div class="m">未认领</div>
        </div></div>
    </div>
    <div class="col" style="left:376px;width:320px;top:88px">
      <div class="chead "><span>进行中</span><span class="chip ">0/3</span></div>
      
    </div>
    <div class="col" style="left:728px;width:320px;top:88px">
      <div class="chead "><span>完成</span><span class="chip ">11</span></div>
      <div class="slot" style="top:148px"><div class="card done">
          <div class="t">#30 裁决:视觉化 skill 的交付形态(是否随 /setup 落目标仓)</div>
          <div class="m">已关</div>
        </div></div><div class="slot" style="top:220px"><div class="card done">
          <div class="t">#29 设计:工作流视觉化 skill(动态状态视图)</div>
          <div class="m">已关</div>
        </div></div><div class="slot" style="top:292px"><div class="card done">
          <div class="t">#28 设计:工作流视觉化 skill(静态流程视图)</div>
          <div class="m">已关</div>
        </div></div><div class="slot" style="top:364px"><div class="card done">
          <div class="t">#27 设计:成谱与成票命令骨架</div>
          <div class="m">已关</div>
        </div></div><div class="slot" style="top:436px"><div class="card more">+7 张(列内有界,只显最近 4 张)</div></div>
    </div>
      </div>
    </foreignObject>
  </svg>
</div>
</body>
</html>
